name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor deps
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Capacitor init
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Ansum Bus" "com.ansum.bus" --web-dir=.
          fi

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Set app name to "Ansum Bus"
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Ansum Bus</string>|' "$STRINGS"
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Ansum Bus</string>|' "$STRINGS"
          fi

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            python3 - "$MANIFEST" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          )
          if 'ACCESS_FINE_LOCATION' not in content:
              content = content.replace('<application', perms + '    <application', 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
          PYEOF
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to Ansum-Bus.apk
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Ansum-Bus.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ansum-Bus-APK
          path: output/Ansum-Bus.apk
          retention-days: 30
